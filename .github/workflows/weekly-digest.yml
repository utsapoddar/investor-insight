name: Alpha Digest — Weekly Pipeline

on:
  schedule:
    # Every Monday at 10:00 UTC (6:00 AM ET)
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: digest-cache-${{ github.run_number }}
          restore-keys: digest-cache-

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.ALPHA_DIGEST_TOKEN }}
        run: python main.py

      - name: Save last_run state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: digest-cache-${{ github.run_number }}

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: data/last_digest.html
          retention-days: 30
