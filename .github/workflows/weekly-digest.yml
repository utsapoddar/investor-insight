name: Alpha Digest — Weekly Pipeline

on:
  schedule:
    # Every Monday at 10:17 UTC (6:17 AM ET) — off-hour minute to avoid Actions scheduler throttling
    - cron: '17 10 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-digest:
    runs-on: ubuntu-latest
    # Data fetch runs ~5 min; summarization retries up to 3x across 3 models (2 Gemini,
    # 1 NVIDIA) at a 150s request timeout, so the true worst case is ~28 min. Typical is
    # ~6 min. This must stay above the worst case: at 15 the job was killed before the
    # fallback could be tried, which defeats the point of having one.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: digest-cache-${{ github.run_number }}
          restore-keys: digest-cache-

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALPHA_DIGEST_TOKEN: ${{ secrets.ALPHA_DIGEST_TOKEN }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: python main.py

      - name: Save last_run state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/cache
          key: digest-cache-${{ github.run_number }}

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ github.run_number }}
          path: data/last_digest.html
          retention-days: 30
