name: Alpha Digest — Weekly Pipeline

on:
  schedule:
    # Every Monday at 10:17 UTC (6:17 AM ET) — off-hour minute to avoid Actions scheduler throttling
    - cron: '17 10 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-digest:
    runs-on: ubuntu-latest
    # Data fetch runs ~5 min; summarization now retries up to 3x across 2 models at a
    # 150s request timeout, so the worst case is ~20 min. At 15 the job was killed
    # before the fallback model could be tried.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: digest-cache-${{ github.run_number }}
          restore-keys: digest-cache-

      - name: Run pipeline
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALPHA_DIGEST_TOKEN: ${{ secrets.ALPHA_DIGEST_TOKEN }}
        run: python main.py

      - name: Save last_run state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/cache
          key: digest-cache-${{ github.run_number }}

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ github.run_number }}
          path: data/last_digest.html
          retention-days: 30
